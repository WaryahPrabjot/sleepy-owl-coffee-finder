<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleepy Owl Coffee Finder — Concept Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="owl">🦉</div>
    <p class="eyebrow">SLEEPY OWL • CONCEPT PROTOTYPE</p>
    <h1>Find your coffee</h1>
    <p class="intro">Answer five quick questions and we'll find a coffee that fits your taste.</p>

    <section id="quiz">
      <div class="progress"><span id="progressBar"></span></div>
      <p class="step" id="stepText"></p>
      <h2 id="question"></h2>
      <div id="options"></div>
      <button class="back" id="backBtn" type="button">← Back</button>
    </section>

    <section id="result" class="hidden">
      <p class="eyebrow">YOUR MATCH</p>
      <div class="result-card">
        <div class="result-icon" id="resultIcon">☕</div>
        <h2 id="resultName"></h2>
        <p id="resultDescription"></p>
        <div class="tags" id="resultTags"></div>
        <button id="restartBtn" type="button">Try again</button>
      </div>
      <p class="disclaimer">Concept prototype for demonstration purposes. Not affiliated with or endorsed by Sleepy Owl.</p>
    </section>

    <footer>Made as a personal UX/product concept • 2026</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
